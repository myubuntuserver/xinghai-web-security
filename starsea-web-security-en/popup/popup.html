<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }
    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      padding: 16px;
      border-bottom: 1px solid #1e40af;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .version { font-size: 11px; color: #64748b; }
    .status-bar {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .status-dot.off { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: #334155;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on { background: #22c55e; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }

    .current-site {
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .site-url {
      font-size: 12px;
      color: #94a3b8;
      word-break: break-all;
      margin-bottom: 6px;
    }
    .site-verdict {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .verdict-safe { background: #166534; color: #4ade80; }
    .verdict-danger { background: #991b1b; color: #fca5a5; }
    .verdict-warn { background: #854d0e; color: #fde047; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: #334155;
      border-bottom: 1px solid #334155;
    }
    .stat-cell {
      background: #1e293b;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-num { font-size: 20px; font-weight: 700; color: #60a5fa; }
    .stat-num.danger { color: #f87171; }
    .stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 12px;
    }
    .info-row .label { color: #94a3b8; }
    .info-row .value { color: #e2e8f0; font-weight: 500; }

    .threat-list { max-height: 150px; overflow-y: auto; }
    .threat-item {
      padding: 8px;
      background: #1e293b;
      border-radius: 6px;
      margin-bottom: 6px;
      border-left: 3px solid #ef4444;
    }
    .threat-item.high { border-left-color: #f97316; }
    .threat-item.medium { border-left-color: #eab308; }
    .threat-url { font-size: 11px; color: #94a3b8; word-break: break-all; }
    .threat-family { font-size: 12px; color: #f87171; font-weight: 600; }
    .threat-time { font-size: 10px; color: #475569; }

    .actions {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }
    .btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .btn:hover { background: #334155; border-color: #475569; }
    .btn-primary { background: #1d4ed8; border-color: #2563eb; }
    .btn-primary:hover { background: #2563eb; }

    .footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 10px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌊</div>
    <div>
      <h1>StarSea Web Security</h1>
      <div class="version">v1.2.0</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Protection Active</span>
    </div>
    <div class="toggle on" id="toggleBtn"></div>
  </div>

  <div class="current-site">
    <div class="site-url" id="currentUrl">Scanning...</div>
    <div class="site-verdict verdict-safe" id="siteVerdict">✓ Safe</div>
  </div>

  <div class="stats-grid">
    <div class="stat-cell">
      <div class="stat-num danger" id="totalBlocks">0</div>
      <div class="stat-label">Blocked</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="domainCount">0</div>
      <div class="stat-label">Domain Rules</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="ipCount">0</div>
      <div class="stat-label">IP Rules</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Threat Intelligence</div>
    <div class="info-row">
      <span class="label">Rule Version</span>
      <span class="value" id="blocklistVersion">-</span>
    </div>
    <div class="info-row">
      <span class="label">URL Rules</span>
      <span class="value" id="urlCount">0</span>
    </div>
    <div class="info-row">
      <span class="label">File Hashes</span>
      <span class="value" id="hashCount">0</span>
    </div>
    <div class="info-row">
      <span class="label">Heuristic Detection</span>
      <span class="value" id="heuristicStatus">Enabled</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Recent Blocks</div>
    <div class="threat-list" id="threatList">
      <div style="color:#475569; font-size:12px; text-align:center; padding:12px;">No blocked threats yet</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="optionsBtn">⚙️ Settings</button>
    <button class="btn btn-primary" id="refreshBtn">🔄 Update Rules</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
